name: Frontend CI Pipeline

on:
  push:
    branches: [ development, main, feat/**, fix/** ]
  pull_request:
    branches: [ development, main ]

jobs:
  frontend-ci:
    name: Frontend Quality & Build (Turbo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check (Turbo)
        run: pnpm typecheck

      - name: Lint (ESLint via Turbo)
        run: pnpm lint

      - name: Unit Tests (Vitest via Turbo)
        run: pnpm test

      - name: Production Build (Next.js via Turbo)
        run: pnpm build
