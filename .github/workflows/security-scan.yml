name: Security & Quality Scans

on:
  push:
    branches: [ development, main, feat/**, fix/** ]
  pull_request:
    branches: [ development, main ]

jobs:
  secret-scan:
    name: Secret Leak Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Audit Frontend Dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Backend Dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          for req in backend/services/*/requirements.txt backend/ecommerce-django-backend/requirements.txt; do
            if [ -f "$req" ]; then
              echo "Auditing $req..."
              pip-audit -r "$req" || true
            fi
          done

  backend-static-analysis:
    name: Backend Lint & Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check backend/"
