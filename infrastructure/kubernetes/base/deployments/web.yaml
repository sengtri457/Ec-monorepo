apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ecommerce-microservices
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: ecommerce-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: ecommerce-system
    spec:
      containers:
        - name: web
          image: ec-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: INTERNAL_API_URL
              value: "http://gateway/api/v1"
            - name: NEXT_PUBLIC_API_URL
              value: "/api/v1"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
