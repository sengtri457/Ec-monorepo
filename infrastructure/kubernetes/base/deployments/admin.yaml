apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: ecommerce-microservices
  labels:
    app: admin
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: ecommerce-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
        app.kubernetes.io/name: admin
        app.kubernetes.io/part-of: ecommerce-system
    spec:
      containers:
        - name: admin
          image: ec-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "/api/v1"
          livenessProbe:
            httpGet:
              path: /login
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /login
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
