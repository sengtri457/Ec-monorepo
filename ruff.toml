target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long
    "F401",   # unused imports
    "RUF012", # mutable class attribute default
    "I001",   # unsorted imports
]
exclude = [
    "**/migrations/**",
    "**/__pycache__/**",
    ".git",
    "node_modules",
    ".next",
    "dist",
]
