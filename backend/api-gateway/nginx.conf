worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Docker Embedded DNS Resolver (ensures fresh IP resolution across container restarts)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Rate Limiting Zones (DDoS and Brute-Force Perimeter Protection)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    limit_req_status 429;

    # Upstream Microservice Definitions
    upstream user_service {
        server user-service:8000;
    }

    upstream product_service {
        server product-service:8000;
    }

    upstream order_service {
        server order-service:8000;
    }

    upstream payment_service {
        server payment-service:8000;
    }

    upstream notification_service {
        server notification-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Perimeter Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Security: Prevent external clients from reaching internal service-to-service endpoints
        location /internal/ {
            default_type application/json;
            return 403 '{"error": {"code": "FORBIDDEN", "message": "Access to internal endpoints is restricted."}}';
        }

        # Common Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Session-Key $http_x_session_key;
        proxy_set_header X-Order-Token $http_x_order_token;

        # Security: Strip spoofable internal secret and identity headers from external callers
        proxy_set_header X-Internal-Service-Key "";
        proxy_set_header X-User-Role "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # 1. User & Authentication Routes (Rate-limited)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://user_service/api/v1/auth/;
        }
        location /api/v1/users/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user_service/api/v1/users/;
        }
        location /api/v1/addresses/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://user_service/api/v1/addresses/;
        }

        # 2. Product & Catalog Routes
        location /api/v1/catalog/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://product_service/api/v1/catalog/;
        }
        location /api/v1/inventory/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://product_service/api/v1/inventory/;
        }

        # 3. Order & Cart Routes
        location /api/v1/cart/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://order_service/api/v1/cart/;
        }
        location /api/v1/orders/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://order_service/api/v1/orders/;
        }

        # 4. Payment Routes (Rate-limited)
        location /api/v1/payments/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://payment_service/api/v1/payments/;
        }

        # 5. Notification Routes
        location /api/v1/notifications/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://notification_service/api/v1/notifications/;
        }

        # Health Gateway Check (Supports /health, /health/, and /api/v1/health)
        location ~ ^/(api/v1/)?health/?$ {
            default_type application/json;
            return 200 '{"gateway": "nginx", "status": "healthy"}';
        }
    }
}
