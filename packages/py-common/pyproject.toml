[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ec-py-common"
version = "0.1.0"
description = "Shared Python library for EC microservices: JWT auth, NBC Bakong KHQR, and internal security"
authors = [{ name = "EC Engineering Team" }]
dependencies = [
    "pyjwt>=2.8.0",
    "requests>=2.31.0",
]
readme = "README.md"
requires-python = ">=3.10"
